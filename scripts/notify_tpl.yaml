#########################################################
#
#             Text Notify
#
#########################################################


  text_notify:
    sequence:
      - condition: state
        entity_id: input_boolean.text_notifications
        state: 'on'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ who == "duc"}}'
          - condition: state
            entity_id: input_boolean.text_notify_duc
            state: 'on'
          sequence:
            - service: notify.send_message
              target:
                entity_id: notify.id # notify.mobile_app_id
              data:
                title: '{{ title }}'
                message: '{{ message }}'

        - conditions:
          - condition: template
            value_template: '{{ who == "eri"}}'
          - condition: state
            entity_id: input_boolean.text_notify_eri
            state: 'on'
          sequence:
            - service: notify.send_message
              target:
                entity_id: notify.ie
              data:
                title: '{{ title }}'
                message: '{{ message }}'


# NEED TO FIX BEFORE 2027.3
        - conditions:
          - condition: template
            value_template: '{{ who == "whatsapp_hass"}}'
          - condition: state
            entity_id: input_boolean.text_notify_duc
            state: 'on'
          sequence:
            - service: notify.greenapi
              data:
                title: '{{ title }}'
                message: '{{ message }}'
                target: !secret whatsapp_hass
                
        - conditions:
          - condition: template
            value_template: '{{ who == "whatsapp_jcb"}}'
          - condition: state
            entity_id: input_boolean.text_notify_duc
            state: 'on'
          sequence:
            - service: notify.greenapi
              data:
                title: '{{ title }}'
                message: '{{ message }}'
                target: !secret whatsapp_jcb

        - conditions:
          - condition: template
            value_template: '{{ who == "discord_eta"}}'
          sequence:
            - service: notify.discord_bot
              data:
                target:
                - "1093135539277942784"
                message: '{{ message }}'


        - conditions:
          - condition: template
            value_template: '{{ who == "amber"}}'
          - condition: state
            entity_id: input_boolean.text_notify_duc
            state: 'on'
          sequence:
            - service: telegram_bot.send_message  # notify.amberthebot # telegram_bot.send_message
              data:
                title: '{{ title }}'
                message: '{{ message }}'
                entity_id: notify.telegram_bot_1730593885_591654584

        - conditions:
          - condition: template
            value_template: '{{ who == "desktop"}}'
          sequence:
            - service: notify.desktop_3l5pa48 # old id of msi desktop
              data:
                title: '{{ title }}'
                message: '{{ message }}'


  text_notify_image:
    sequence:
      - condition: state
        entity_id: input_boolean.text_notifications
        state: 'on'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ who == "desktop"}}'
          - condition: state
            entity_id: input_boolean.text_notify_duc
            state: 'on'
          sequence:
            - service: notify.desktop_fddl8i4 # image no longer works.
              data:
                title: '{{ title }}'
                message: '{{ message }}'
                data:
                  image: '{{ image }}'
        - conditions:
          - condition: template
            value_template: '{{ who == "amber"}}'
          - condition: state
            entity_id: input_boolean.text_notify_duc
            state: 'on'
          sequence:
            - service: telegram_bot.send_photo # notify.amberthebot # telegram_bot.send_message
              data:
                verify_ssl: true
                entity_id: notify.telegram_bot_1730593885_591654584
                file: >-
                  {{ image }}
                caption: >-
                  {{ caption }}




#########################################################
#
#             Text Alert
#
#########################################################

  text_alert:
    sequence:
      - service: >
           {% if who == 'duc' %}
              notify.mobile_app_id
           {% elif who == 'eri' %}
              notify.mobile_app_ie
           {% endif %}
        data:
          title: '{{ title }}'
          message: '{{ message }}'

#########################################################
#
#             Text Alert Image
#
#########################################################

  text_alert_image:
    sequence:
      - service: >
           {% if who == 'duc' %}
              notify.mobile_app_id
           {% elif who == 'eri' %}
              notify.mobile_app_ie
           {% endif %}
        data:
          title: '{{ title }}'
          message: '{{ message }}'
          data:
            attachment:
              url: '{{ url }}'
              content-type: '{{ content_type }}'
              hide-thumbnail: false

#########################################################
#
#             Announcement Alert
#
#########################################################

  alexa_alert:
    sequence:
      - service: mqtt.publish
        data_template:
          topic: 'house/alerts/alexa/lastmsg'
          payload: 'This message is from {{ now().strftime("%-I") }}:{{ now().strftime("%M") }} {{ now().strftime("%p") }}. {{ message | striptags | truncate(220)}}'
          retain: true
      - service: >-
          {% if who in ['ai_4'] %}
             notify.alexa_media_ai_4
          {% else %}
             notify.alexa_media_ai_1
          {% endif %}
        data:
          message: >-
            {{ message }}
          data:
            type: tts


