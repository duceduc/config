# MAC: 40:91:51:4F:90:90
substitutions:
  temp_offset: '-5'
  hum_offset: '18'

packages:
  ld2410c: !include components/ld2410c-82.yaml
  aht10: !include components/aht10.yaml

<<: !include .base.yaml

esphome:
  name: washroom-radar
esp8266:
  board: d1_mini  

status_led:
  pin:
    number: GPIO2
    inverted: true # true off blue led

# override package
ld2410:
  id: ld2410_radar
  timeout: 150s # fix false positive
  max_move_distance : 6m
  max_still_distance: 0.75m
  g0_move_threshold: 20 #10
  g0_still_threshold: 30 #20
  g1_move_threshold: 20 #10
  g1_still_threshold: 30 #20
  g2_move_threshold: 30 #20
  g2_still_threshold: 31 #21
  g3_move_threshold: 30
  g3_still_threshold: 31
  g4_move_threshold: 40
  g4_still_threshold: 41
  g5_move_threshold: 50
  g5_still_threshold: 51
  g6_move_threshold: 60
  g6_still_threshold: 61
  g7_move_threshold: 70
  g7_still_threshold: 71
  g8_move_threshold: 80
  g8_still_threshold: 81

# override package
binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: ld2410
    has_target:
      name: Presence
      filters: # fix false positive
        - delayed_on: 3s # 5s
        - delayed_off: 5s #10s
    has_moving_target:
      name: Moving Target
    has_still_target:
      name: Still Target


