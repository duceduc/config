#ESP8266 with LD1115H Radar Sensor [40:91:51:4F:89:61]
# https://github.com/rainchi/ESPHome-LD2410
substitutions:
  name: lr-radar
  temp_offset: '0'
  hum_offset: '0'

packages:
  ld2410: !include components/ld2410-v2.yaml
  bme280: !include components/bme280.yaml
  adc: !include components/adc.yaml # Illuminance

# https://github.com/robertklep/esphome-custom-component
#external_components: # fix for removal of custom component in esphome 2025.xx and up
#  - source: github://robertklep/esphome-custom-component
#    components: [ custom, custom_component ]


#esphome:
#  name: $name
#  includes:
#    - /config/esphome/components/ld2410_uart.h
#  on_boot:
#    priority: 600
#    # ...
#    then:
#      - lambda: |-
#          auto uart_component = static_cast<LD2410 *>(ld2410);
#          uart_component->setNumbers(maxMovingDistanceRange, maxStillDistanceRange, noneDuration);


esphome:
  name: $name
  platformio_options:
    board_build.flash_mode: dio
  project:
    name: Screek.Human_Sensor
    version: 1w

external_components:
  - source:
      type: git
      url: https://github.com/screekworkshop/custom_components_support_for_screek_1w
      ref: main
    components: [ ld2410 ]

esp8266:
  board: d1_mini

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret esphome_apikey

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  ssid: !secret ssid
  min_auth_mode: WPA2
  password: !secret ssid_pwd
  fast_connect : true
  power_save_mode: none
  reboot_timeout: 0s
#  use_address: 192.168.1.160
#  manual_ip:
#    static_ip: 192.168.1.51
#    subnet: 255.255.255.0
#    gateway: 192.168.1.1

