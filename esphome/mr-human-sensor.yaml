# This is a custom firmware for Human Presence Sensor 1U
# https://screek.io/1u
# MAC: 80:65:99:FA:BA:6E
substitutions:
  name: mr-human-sensor

packages:
  ld2410c: !include components/ld2410c.yaml

esphome:
  name: $name
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_cpu: 80000000L

  project:
    name: Screek.Human Presence Sensor
    version: 1w
  min_version: 2025.5.1

esp32:
  board: lolin_s2_mini
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/screekworkshop/custom_components_support_for_screek_1w
      ref: main
    components: [ ld2410 ]

improv_serial:

logger:
  hardware_uart: uart0

wifi:
  ssid: !secret ssid
  password: !secret ssid_pwd

api:
  encryption:
    key: !secret esphome_apikey

ota:
  - platform: esphome
    password: !secret ota_pass

web_server:
  port: 80

#captive_portal:
