#  [98:CD:AC:31:B8:E7]
substitutions:
  name: sr-radar
  temp_offset: '0'
  hum_offset: '0'

packages:
  ld2410: !include components/ld2410-v2.yaml
  aht10: !include components/aht10.yaml

esphome:
  name: $name
  platformio_options:
    board_build.flash_mode: dio
  project:
    name: Screek.Human_Sensor
    version: 1w

external_components:
  - source:
      type: git
      url: https://github.com/screekworkshop/custom_components_support_for_screek_1w
      ref: main
    components: [ ld2410 ]


esp8266:
  board: d1_mini

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret esphome_apikey

ota:
  - platform: esphome
    password: !secret ota_pass

wifi:
  ssid: !secret ssid
  min_auth_mode: WPA2
  password: !secret ssid_pwd

