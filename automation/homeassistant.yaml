#########################################################
#
#             Notify.alexa media last_called workaround
#
#             https://community.home-assistant.io/t/using-alexa-media-player-last-called-service/332546/41
#             https://community.simon42.com/t/notify-alexa-media-last-called-workaround/58718/7
#########################################################


- alias: Alexa - Detect last called echo via ghost attribute
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id:
        - media_player.ai_1
        - media_player.ai_2
        - media_player.ai_3
        - media_player.ai_4
      attribute: ghost
      from: I will vanish when called
      trigger: state

  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'state' }}"
          sequence:
            - variables:
                echo_name: "{{ trigger.entity_id }}"
            - action: input_text.set_value
              data:
                entity_id: input_text.last_called_echo
                value: "{{ echo_name }}"
            - delay: 5
        - conditions:
            - condition: template
              value_template: "{{ trigger.platform == 'homeassistant' }}"
          sequence:
            - delay: 5
    - repeat:
        for_each:
          - media_player.ai_1
          - media_player.ai_2
          - media_player.ai_3
          - media_player.ai_4
        sequence:
          - action: python_script.set_state
            data:
              entity_id: "{{ repeat.item }}"
              ghost: I will vanish when called
  mode: single
  max_exceeded: silent




